version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    labels:
      - "Github actions dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "pip dependencies"
    allow:
      - dependency-type: direct
      - dependency-type: indirect    ignore:
      # The pre-trained TVAE model pickle references modules removed in SDV 2 (e.g. ``sdv.metadata.single_table``).
      # Supporting SDV 2 requires a new model; see the end-to-end tests in ``tests/model``.
      - dependency-name: "sdv"
        update-types: [ "version-update:semver-major" ]
