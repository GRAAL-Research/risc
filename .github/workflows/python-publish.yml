# Build and publish the package to PyPI when a release is published, with PyPI trusted publishing (OIDC): no secret.
# PyPI configuration: project risc_generator > Publishing > GitHub, owner GRAAL-Research, repository risc,
# workflow python-publish.yml, environment pypi.
name: Upload Python Package

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
